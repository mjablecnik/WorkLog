<!doctype html>
<html>
<head>
  <meta charset="utf-8">

<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter Tight', system-ui, sans-serif; background: #0F1319; color: #E6EAF2; -webkit-font-smoothing: antialiased; }
    a { color: #D18A6A; text-decoration: none; }
    .dim   { color: rgba(230,234,242,0.62); }
    .faint { color: rgba(230,234,242,0.50); }
    .lbl { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(230,234,242,0.50); }
    .nav { font-size: 14px; color: rgba(230,234,242,0.50); }
    .nav.on { color: #E6EAF2; font-weight: 500; }
    .rbtn { border-radius: 9999px; display: flex; align-items: center; justify-content: center; }
    .kpi  { display: flex; flex-direction: column; align-items: center; gap: 7px; }
    .kpiv { font-size: 26px; font-weight: 300; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .sw   { width: 8px; height: 8px; border-radius: 2px; display: block; }
  </style>
</helmet>

<div style="min-height: 860px; display: flex; flex-direction: column; padding: 0 48px;">

    <span style="font-size: 15px; font-weight: 600;">Worklog</span>
    <div style="display: flex; gap: 30px; justify-self: center;">
      <span class="nav on">Timer</span><span class="nav">Den</span><span class="nav">Projekty</span><span class="nav">Statistiky</span>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; justify-self: end;"><div style="width: 30px; height: 30px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.07); flex-shrink: 0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E6EAF2" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"></circle><path d="M19.1 14.4a1.7 1.7 0 0 0 .35 1.87l.06.07a2 2 0 1 1-2.83 2.83l-.06-.07a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.56 1.7 1.7 0 0 0-1.88.34l-.06.07a2 2 0 1 1-2.83-2.83l.06-.07A1.7 1.7 0 0 0 4.9 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.66 8.9a1.7 1.7 0 0 0-.35-1.87l-.06-.07a2 2 0 1 1 2.83-2.83l.06.07A1.7 1.7 0 0 0 9 4.55 1.7 1.7 0 0 0 10.06 3V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.35l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.35 1.88V9a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.56 1.03z"></path></svg></div></div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding-bottom: 16px;">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <div style="font-size: 68px; font-weight: 300; letter-spacing: -0.035em; line-height: 1; font-variant-numeric: tabular-nums;">5:12:08</div>
      <span class="lbl">běží od 21:00</span>
    </div>

    <div style="position: relative; width: 340px; height: 340px;">

        <line x1="233.00" y1="33.56" x2="235.00" y2="30.10" stroke="rgba(230,234,242,0.14)" stroke-width="1.1" stroke-linecap="round"></line>

        <line x1="301.03" y1="197.79" x2="304.89" y2="198.82" stroke="rgba(230,234,242,0.14)" stroke-width="1.1" stroke-linecap="round"></line>

        <line x1="263.24" y1="263.24" x2="270.31" y2="270.31" stroke="rgba(230,234,242,0.30)" stroke-width="1.5" stroke-linecap="round"></line>
        <text x="278.79" y="282.99" fill="rgba(230,234,242,0.17)" font-family="Inter Tight, sans-serif" font-size="12" text-anchor="middle">00</text>

        <path d="M 48.26 122.07 A 118 118 0 0 1 88.17 66.38" fill="none" stroke="#3899EA" stroke-width="6"></path>

        <circle cx="257.58" cy="257.58" r="4" fill="#D18A6A"></circle>
        <text x="160.00" y="326.20" fill="#D18A6A" font-family="Inter Tight, sans-serif" font-size="12" font-weight="500" text-anchor="middle">03:00</text>
    </svg>
      <div class="rbtn" style="position: absolute; left: 170px; top: 170px; transform: translate(-50%, -50%); width: 104px; height: 104px; background: #D18A6A; color: #1A0F0A; box-shadow: 0 0 0 12px rgba(209,138,106,0.09);">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2.5"></rect></svg>
      </div>
    </div>

    <!-- Gauge readouts: UNCHANGED by this spec (Requirement 7.2) - they describe the
         timer frame only, and leisure never enters it. -->
    <div style="display: flex; align-items: flex-start; gap: 56px; margin-top: 2px;">
      <div class="kpi"><span class="lbl">odpracováno</span><span class="kpiv">14 h 15 min</span></div>
      <div class="kpi"><span class="lbl">popsáno</span><span class="kpiv">12 h 05 min</span></div>
      <div class="kpi"><span class="lbl">chybí popis</span><span class="kpiv" style="color: #D18A6A;">2 h 10 min</span></div>
    </div>

    <!-- NEW (Requirements 6.2, 6.3): the category split, added BESIDE the gauge
         figures rather than folded into them. Odpočinek is deliberately outside the
         "odpracováno" total - it is not tracked time. -->
    <div style="display: flex; align-items: center; gap: 0; height: 46px; padding: 0 6px; border-radius: 9999px; background: rgba(255,255,255,0.043);">
      <div style="display: flex; align-items: center; gap: 9px; padding: 0 16px;">
        <span class="sw" style="background: #3899EA;"></span>
        <span style="font-size: 12.5px;" class="dim">placeno</span>
        <span style="font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums;">9 h 30 min</span>
      </div>
      <span style="width: 1px; height: 18px; background: rgba(255,255,255,0.08);"></span>
      <div style="display: flex; align-items: center; gap: 9px; padding: 0 16px;">
        <span class="sw" style="background: #A19201;"></span>
        <span style="font-size: 12.5px;" class="dim">neplaceno</span>
        <span style="font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums;">2 h 35 min</span>
      </div>
      <span style="width: 1px; height: 18px; background: rgba(255,255,255,0.08);"></span>
      <div style="display: flex; align-items: center; gap: 9px; padding: 0 16px;">
        <span class="sw" style="background: #7C8899;"></span>
        <span style="font-size: 12.5px;" class="dim">odpočinek</span>
        <span style="font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums;">2 h 15 min</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; height: 50px; padding: 0 22px 0 14px; border-radius: 9999px; background: rgba(255,255,255,0.05);">
      <div class="rbtn" style="width: 34px; height: 34px; background: rgba(255,255,255,0.06);">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(230,234,242,0.7)" stroke-width="1.8" stroke-linecap="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
      </div>
      <span style="font-size: 14px;" class="dim">Zapsat 01:30 → teď</span>
      <span style="font-size: 13px;" class="faint">2 h 10 min bez popisu</span>
    </div>

    <!-- Legend: unchanged. It names only what the inner arc draws, and the arc draws
         no leisure (Requirement 7.3), so no odpočinek swatch appears here. -->
    <div style="display: flex; gap: 22px;">
      <span style="font-size: 12px; display: flex; align-items: center; gap: 7px;" class="faint"><span class="sw" style="background: #B7466C;"></span>Trindade</span>
      <span style="font-size: 12px; display: flex; align-items: center; gap: 7px;" class="faint"><span class="sw" style="background: #3899EA;"></span>Worklog</span>
      <span style="font-size: 12px; display: flex; align-items: center; gap: 7px;" class="faint"><span class="sw" style="background: #A19201;"></span>Dům a zahrada</span>
      <span style="font-size: 12px; display: flex; align-items: center; gap: 7px;" class="faint"><span style="width: 14px; height: 0; border-top: 2px dashed rgba(209,138,106,0.65); display: block;"></span>bez popisu</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>

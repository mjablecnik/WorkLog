<!doctype html>
<html>

<x-dc>

    <span style="font-size: 13px; line-height: 1.6;" class="dim">{{state.line1}}</span>
    <span style="font-size: 13px; line-height: 1.6;" class="dim">{{state.line2}}</span>

  <span style="font-size: 12px;" class="faint">Přepínač „přesah“ je nad artboardem — klikni na něj.</span>

<script data-dc-script data-props='{"presah":{"editor":"boolean","default":true}}'>
class Component extends DCLogic {
  renderVals() {
    const over = this.props.presah ?? true;
    const state = over
      ? {
          plain: false,
          overrun: true,
          accent: '#D18A6A',
          elapsed: '5:12:08',
          caption: 'běží od 21:00 · přetaženo za půlnoc',
          title: 'S přesahem — pracoval jsi do 03:00',
          line1: 'Poslední tři hodiny leží za koncem dráhy, vpravo dole. Pod ní žádná dráha není, takže oblouk viditelně pokračuje do mezery.',
          line2: 'Nic se neořezalo — 03:00 má svůj úhel jako každý jiný čas, jen pod ním už není dráha.'
        }
      : {
          plain: true,
          overrun: false,
          accent: '#09AF72',
          elapsed: '4:00:00',
          caption: 'zastaveno o půlnoci',
          title: 'Bez přesahu — běžný den',
          line1: 'Den skončil o půlnoci, tedy přesně na konci připravené dráhy. Oblouk je uzavřený tachometr s mezerou dole.',
          line2: 'Takhle to vypadá, dokud se držíš v okně 06:00 – 00:00.'
        };
    return { state };
  }
}
</script>

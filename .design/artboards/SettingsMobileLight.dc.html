<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter Tight', system-ui, sans-serif; background: #F3EEE6; color: #2B2420; -webkit-font-smoothing: antialiased; }
    .dim   { color: rgba(43,36,32,0.78); }
    .faint { color: rgba(43,36,32,0.66); }
    .lbl { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(43,36,32,0.66); }
    .tab { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 10px; color: rgba(43,36,32,0.66); height: 100%; }
    .seg { flex-grow: 1; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; border-radius: 10px; color: rgba(43,36,32,0.78); }
    .seg.on { background: rgba(165,82,46,0.14); color: #A5522E; font-weight: 500; }
    .gear { width: 32px; height: 32px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.06); }
  </style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; box-sizing: border-box; position: relative; overflow: hidden;">

  <div style="height: 60px; display: flex; align-items: center; gap: 10px; padding: 0 22px; flex-shrink: 0;">
    <span style="font-size: 15px; font-weight: 600; flex-grow: 1;">Worklog</span>
    <span style="width: 6px; height: 6px; border-radius: 9999px; background: #A5522E; display: block;"></span>
    <span style="font-size: 12px; font-variant-numeric: tabular-nums; margin-right: 4px;" class="dim">5:12</span>
    <div class="gear">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2B2420" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"></circle><path d="M19.1 14.4a1.7 1.7 0 0 0 .35 1.87l.06.07a2 2 0 1 1-2.83 2.83l-.06-.07a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.56 1.7 1.7 0 0 0-1.88.34l-.06.07a2 2 0 1 1-2.83-2.83l.06-.07A1.7 1.7 0 0 0 4.9 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.66 8.9a1.7 1.7 0 0 0-.35-1.87l-.06-.07a2 2 0 1 1 2.83-2.83l.06.07A1.7 1.7 0 0 0 9 4.55 1.7 1.7 0 0 0 10.06 3V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.35l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.35 1.88V9a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.56 1.03z"></path></svg>
    </div>
  </div>

  <div style="flex-grow: 1; padding: 0 22px; display: flex; flex-direction: column; gap: 14px;">
    <span style="font-size: 17px; font-weight: 500;">pátek 21. srpna</span>
    <div style="height: 74px; border-radius: 9px; background: rgba(204,90,127,0.13); border-left: 3px solid #CC5A7F;"></div>
    <div style="height: 74px; border-radius: 9px; background: rgba(34,135,215,0.13); border-left: 3px solid #2287D7;"></div>
    <div style="height: 48px; border-radius: 9px; background: rgba(0,102,64,0.13); border-left: 3px solid #006640;"></div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(43,36,32,0.38); z-index: 2;"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; background: #FBF7F1; border-radius: 20px 20px 0 0; padding: 10px 22px 26px; display: flex; flex-direction: column; gap: 20px;">

    <div style="width: 38px; height: 4px; border-radius: 9999px; background: rgba(0,0,0,0.16); align-self: center; margin-bottom: 4px;"></div>

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <span class="lbl">motiv</span>
      <div style="display: flex; gap: 4px; background: rgba(0,0,0,0.04); border-radius: 13px; padding: 4px;">
        <div class="seg on">Systém</div>
        <div class="seg">Světlý</div>
        <div class="seg">Tmavý</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <span class="lbl">jazyk</span>
      <div style="display: flex; gap: 4px; background: rgba(0,0,0,0.04); border-radius: 13px; padding: 4px;">
        <div class="seg on">Čeština</div>
        <div class="seg">English</div>
      </div>
    </div>

    <div style="height: 1px; background: rgba(0,0,0,0.07);"></div>

    <div style="display: flex; align-items: center; gap: 11px; height: 44px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#A8321F" stroke-width="1.8" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>
      <span style="font-size: 14.5px; color: #A8321F;">Odhlásit se</span>
    </div>

  </div>

  <div style="height: 68px; display: flex; align-items: center; border-top: 1px solid rgba(0,0,0,0.05); flex-shrink: 0;">
    <div class="tab">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2"></path><path d="M9 2h6"></path></svg>
      <span>Timer</span>
    </div>
    <div class="tab">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
      <span>Den</span>
    </div>
    <div class="tab">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
      <span>Projekty</span>
    </div>
    <div class="tab">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>
      <span>Statistiky</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter Tight', system-ui, sans-serif; background: #0F1319; color: #E6EAF2; -webkit-font-smoothing: antialiased; }
    a { color: #D18A6A; text-decoration: none; }
    a:hover { color: #E2A88D; }
    .dim   { color: rgba(230,234,242,0.55); }
    .faint { color: rgba(230,234,242,0.40); }
    .lbl { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(230,234,242,0.40); }
    .nav { font-size: 14px; color: rgba(230,234,242,0.40); }
    .nav.on { color: #E6EAF2; font-weight: 500; }
    .rbtn { border-radius: 9999px; display: flex; align-items: center; justify-content: center; }
  </style>
</helmet>

<div style="min-height: 900px; display: flex; flex-direction: column; padding: 0 48px;">

  <div style="height: 84px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;">
    <span style="font-size: 15px; font-weight: 600;">Worklog</span>
    <div style="display: flex; gap: 30px; justify-self: center;">
      <span class="nav on">Timer</span><span class="nav">Den</span><span class="nav">Projekty</span><span class="nav">Statistiky</span>
    </div>
    <span style="font-size: 13px; justify-self: end;" class="faint">CS</span>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding-bottom: 20px;">

    <!-- elapsed, above the gauge -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <div style="font-size: 68px; font-weight: 300; letter-spacing: -0.035em; line-height: 1; font-variant-numeric: tabular-nums;">5:12:08</div>
      <span class="lbl">běží od 21:00</span>
    </div>

    <!-- gauge with the control at its exact centre -->
    <div style="position: relative; width: 340px; height: 340px;">
      <svg width="340" height="340" viewBox="-22 -22 364 364">
        <path d="M 62.42 257.58 A 138 138 0 1 1 257.58 257.58" fill="none" stroke="rgba(255,255,255,0.055)" stroke-width="10" stroke-linecap="round"></path>

        <text x="41.21" y="282.99" fill="rgba(230,234,242,0.17)" font-family="Inter Tight, sans-serif" font-size="12" text-anchor="middle">06</text>
        <line x1="33.56" y1="233.00" x2="30.10" y2="235.00" stroke="rgba(230,234,242,0.14)" stroke-width="1.1" stroke-linecap="round"></line>
        <line x1="18.97" y1="197.79" x2="15.11" y2="198.82" stroke="rgba(230,234,242,0.14)" stroke-width="1.1" stroke-linecap="round"></line>
        <line x1="14.00" y1="160.00" x2="6.00" y2="160.00" stroke="rgba(230,234,242,0.24)" stroke-width="1.3" stroke-linecap="round"></line>
        <text x="-6.00" y="164.20" fill="rgba(230,234,242,0.17)" font-family="Inter Tight, sans-serif" font-size="12" text-anchor="middle">09</text>
        <line x1="18.97" y1="122.21" x2="15.11" y2="121.18" stroke="rgba(230,234,242,0.14)" stroke-width="1.1" stroke-linecap="round"></line>
        <line x1="33.56" y1="87.00" x2="30.10" y2="85.00" stroke="rgba(230,234,242,0.14)" stroke-width="1.1" stroke-linecap="round"></line>
        <line x1="56.76" y1="56.76" x2="49.69" y2="49.69" stroke="rgba(230,234,242,0.30)" stroke-width="1.5" stroke-linecap="round"></line>
        <text x="41.21" y="45.41" fill="rgba(230,234,242,0.17)" font-family="Inter Tight, sans-serif" font-size="12" text-anchor="middle">12</text>
        <line x1="87.00" y1="33.56" x2="85.00" y2="30.10" stroke="rgba(230,234,242,0.14)" stroke-width="1.1" stroke-linecap="round"></line>
        <line x1="122.21" y1="18.97" x2="121.18" y2="15.11" stroke="rgba(230,234,242,0.14)" stroke-width="1.1" stroke-linecap="round"></line>
        <line x1="160.00" y1="14.00" x2="160.00" y2="6.00" stroke="rgba(230,234,242,0.24)" stroke-width="1.3" stroke-linecap="round"></line>
        <text x="160.00" y="-1.80" fill="rgba(230,234,242,0.17)" font-family="Inter Tight, sans-serif" font-size="12" text-anchor="middle">15</text>
        <line x1="197.79" y1="18.97" x2="198.82" y2="15.11" stroke="rgba(230,234,242,0.14)" stroke-width="1.1" stroke-linecap="round"></line>
        <line x1="233.00" y1="33.56" x2="235.00" y2="30.10" stroke="rgba(230,234,242,0.14)" stroke-width="1.1" stroke-linecap="round"></line>
        <line x1="263.24" y1="56.76" x2="270.31" y2="49.69" stroke="rgba(230,234,242,0.30)" stroke-width="1.5" stroke-linecap="round"></line>
        <text x="278.79" y="45.41" fill="rgba(230,234,242,0.17)" font-family="Inter Tight, sans-serif" font-size="12" text-anchor="middle">18</text>
        <line x1="286.44" y1="87.00" x2="289.90" y2="85.00" stroke="rgba(230,234,242,0.14)" stroke-width="1.1" stroke-linecap="round"></line>
        <line x1="301.03" y1="122.21" x2="304.89" y2="121.18" stroke="rgba(230,234,242,0.14)" stroke-width="1.1" stroke-linecap="round"></line>
        <line x1="306.00" y1="160.00" x2="314.00" y2="160.00" stroke="rgba(230,234,242,0.24)" stroke-width="1.3" stroke-linecap="round"></line>
        <text x="326.00" y="164.20" fill="rgba(230,234,242,0.17)" font-family="Inter Tight, sans-serif" font-size="12" text-anchor="middle">21</text>
        <line x1="301.03" y1="197.79" x2="304.89" y2="198.82" stroke="rgba(230,234,242,0.14)" stroke-width="1.1" stroke-linecap="round"></line>
        <line x1="286.44" y1="233.00" x2="289.90" y2="235.00" stroke="rgba(230,234,242,0.14)" stroke-width="1.1" stroke-linecap="round"></line>
        <line x1="263.24" y1="263.24" x2="270.31" y2="270.31" stroke="rgba(230,234,242,0.30)" stroke-width="1.5" stroke-linecap="round"></line>
        <text x="278.79" y="282.99" fill="rgba(230,234,242,0.17)" font-family="Inter Tight, sans-serif" font-size="12" text-anchor="middle">00</text>

        <path d="M 26.70 195.72 A 138 138 0 0 1 75.99 50.52" fill="none" stroke="rgba(230,234,242,0.34)" stroke-width="10"></path>
        <path d="M 98.96 36.23 A 138 138 0 0 1 229.00 40.49" fill="none" stroke="rgba(230,234,242,0.34)" stroke-width="10"></path>
        <path d="M 298.00 160.00 A 138 138 0 0 1 160.00 298.00" fill="none" stroke="#D18A6A" stroke-width="10"></path>

        <path d="M 46.02 190.54 A 118 118 0 0 1 48.26 122.07" fill="none" stroke="#B7466C" stroke-width="6"></path>
        <path d="M 48.26 122.07 A 118 118 0 0 1 88.17 66.38" fill="none" stroke="#3899EA" stroke-width="6"></path>
        <path d="M 107.81 54.17 A 118 118 0 0 1 175.40 43.01" fill="none" stroke="#3899EA" stroke-width="6"></path>
        <path d="M 175.40 43.01 A 118 118 0 0 1 185.54 44.80" fill="none" stroke="#09AF72" stroke-width="6"></path>
        <path d="M 185.54 44.80 A 118 118 0 0 1 219.00 57.81" fill="none" stroke="rgba(209,138,106,0.65)" stroke-width="6" stroke-dasharray="3 6" stroke-linecap="round"></path>
        <path d="M 278.00 160.00 A 118 118 0 0 1 248.72 237.80" fill="none" stroke="#3899EA" stroke-width="6"></path>
        <path d="M 248.72 237.80 A 118 118 0 0 1 205.16 269.02" fill="none" stroke="#B7466C" stroke-width="6"></path>
        <path d="M 205.16 269.02 A 118 118 0 0 1 160.00 278.00" fill="none" stroke="rgba(209,138,106,0.65)" stroke-width="6" stroke-dasharray="3 6" stroke-linecap="round"></path>
        <circle cx="257.58" cy="257.58" r="4" fill="#D18A6A"></circle>
        <text x="160.00" y="326.20" fill="#D18A6A" font-family="Inter Tight, sans-serif" font-size="12" font-weight="500" text-anchor="middle">03:00</text>
    </svg>

      <!-- dead centre of the arc: viewBox x=160 lands at 170px, y=160 at 160px -->
      <div class="rbtn" style="position: absolute; left: 170px; top: 170px; transform: translate(-50%, -50%); width: 104px; height: 104px; background: #D18A6A; color: #1A0F0A; box-shadow: 0 0 0 12px rgba(209,138,106,0.09);">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2.5"></rect></svg>
      </div>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 56px; margin-top: 2px;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 7px;">
        <span class="lbl">odpracováno</span>
        <span style="font-size: 26px; font-weight: 300; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;">14 h 15 min</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 7px;">
        <span class="lbl">popsáno</span>
        <span style="font-size: 26px; font-weight: 300; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;">11 h 35 min</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 7px;">
        <span class="lbl">chybí popis</span>
        <span style="font-size: 26px; font-weight: 300; letter-spacing: -0.02em; color: #D18A6A; font-variant-numeric: tabular-nums;">2 h 40 min</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; height: 50px; padding: 0 22px 0 14px; border-radius: 9999px; background: rgba(255,255,255,0.05);">
      <div class="rbtn" style="width: 34px; height: 34px; background: rgba(255,255,255,0.06);">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(230,234,242,0.7)" stroke-width="1.8" stroke-linecap="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
      </div>
      <span style="font-size: 14px;" class="dim">Zapsat 01:30 → teď</span>
      <span style="font-size: 13px;" class="faint">2 h 40 min bez popisu</span>
    </div>

    <div style="display: flex; gap: 22px;">
      <span style="font-size: 12px; display: flex; align-items: center; gap: 7px;" class="faint"><span style="width: 8px; height: 8px; border-radius: 2px; background: #B7466C; display: block;"></span>Trindade</span>
      <span style="font-size: 12px; display: flex; align-items: center; gap: 7px;" class="faint"><span style="width: 8px; height: 8px; border-radius: 2px; background: #09AF72; display: block;"></span>Interní</span>
      <span style="font-size: 12px; display: flex; align-items: center; gap: 7px;" class="faint"><span style="width: 8px; height: 8px; border-radius: 2px; background: #3899EA; display: block;"></span>Worklog</span>
      <span style="font-size: 12px; display: flex; align-items: center; gap: 7px;" class="faint"><span style="width: 14px; height: 0; border-top: 2px dashed rgba(209,138,106,0.65); display: block;"></span>bez popisu</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
